name: Hotel F5 isolated acceptance

on:
  push:
    branches:
      - codex/hotel-damoon-f5-staging-20261013
  workflow_dispatch:
    inputs:
      run_staging_browser:
        description: Run authenticated CMS E2E against the separately provisioned SSO-protected F5 staging host
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hotel-f5-staging-acceptance
  cancel-in-progress: false

jobs:
  postgres-17-migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hotel_f5_rehearsal
          POSTGRES_USER: hotel_f5_ci
          POSTGRES_PASSWORD: hotel_f5_ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_f5_ci -d hotel_f5_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://hotel_f5_ci:hotel_f5_ci_ephemeral_only@127.0.0.1:5432/hotel_f5_rehearsal?schema=public
      DIRECT_URL: postgresql://hotel_f5_ci:hotel_f5_ci_ephemeral_only@127.0.0.1:5432/hotel_f5_rehearsal?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: node scripts/hotel/verify-f5-pg17-rehearsal.mjs --before
      - run: pnpm exec prisma migrate deploy
      - run: node scripts/hotel/verify-f5-pg17-rehearsal.mjs --after-migrate
      - name: Re-run the provenance-verified additive branding repair
        shell: bash
        run: |
          git fetch --no-tags origin refs/tags/hotel-f5-branding-repair-source:refs/tags/hotel-f5-branding-repair-source
          test "$(git rev-parse refs/tags/hotel-f5-branding-repair-source)" = "57e407077f88c22c62ff12ff15cc6c2602ee3c96"
          git show 57e407077f88c22c62ff12ff15cc6c2602ee3c96:prisma/migrations/20260926160000_repair_organization_branding_columns/migration.sql > "$RUNNER_TEMP/branding-repair.sql"
          echo "cfa7ed49b14f25ca88593525a6f269e189b6be1e78e760bb5073ecf40c98eb59  $RUNNER_TEMP/branding-repair.sql" | sha256sum --check
          pnpm exec prisma db execute --schema prisma/schema.prisma --file "$RUNNER_TEMP/branding-repair.sql"
      - run: pnpm exec prisma migrate deploy
      - run: node scripts/hotel/verify-f5-pg17-rehearsal.mjs

      - name: Create a uniquely labeled disposable C1B2 API acceptance database
        id: c1b2-db
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(openssl rand -hex 8)"
          volume="hotel-website-c1b2-${run_id}"
          container_name="hotel-website-c1b2-${run_id}"
          database="bazarbaaz_hotel_c1b2_${run_id}"
          password="f5_ci_${run_id}_ephemeral_only"

          docker volume create "$volume" >/dev/null
          echo "HOTEL_WEBSITE_C1B2_VOLUME_NAME=$volume" >> "$GITHUB_ENV"
          echo "HOTEL_WEBSITE_C1B2_RUN_ID=$run_id" >> "$GITHUB_ENV"

          container_id="$(docker run --detach \
            --name "$container_name" \
            --label codex.task=hotel-website-c1b2-db-acceptance \
            --label "codex.run_id=${run_id}" \
            --mount "type=volume,source=${volume},target=/var/lib/postgresql/data" \
            --publish 127.0.0.1:5433:5432 \
            --env "POSTGRES_DB=${database}" \
            --env POSTGRES_USER=c1b2_test \
            --env "POSTGRES_PASSWORD=${password}" \
            postgres:17-alpine)"
          echo "HOTEL_WEBSITE_C1B2_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$container_id" pg_isready -U c1b2_test -d "$database" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          url="postgresql://c1b2_test:${password}@127.0.0.1:5433/${database}?schema=public"
          {
            echo "DATABASE_URL=${url}"
            echo "DIRECT_URL=${url}"
            echo "HOTEL_WEBSITE_PUBLIC_OPERATIONAL_ENABLED=1"
            echo "AI_MEDIA_LOCAL_DOCKER_E2E=1"
            echo "HOTEL_WEBSITE_C1B2_PG_ACCEPTANCE=1"
          } >> "$GITHUB_ENV"

          echo "Disposable PostgreSQL 17 target started on loopback port 5433 with synthetic-only credentials and task/run labels."

      - name: Migrate the disposable C1B2 API acceptance database
        run: pnpm exec prisma migrate deploy

      - name: Run real PostgreSQL-backed C1B2 public API acceptance
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-website-public-c1b2.postgres.local.test.ts

      - name: Remove only the disposable C1B2 acceptance database resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOTEL_WEBSITE_C1B2_CONTAINER_ID:-}" ]]; then
            docker rm --force "$HOTEL_WEBSITE_C1B2_CONTAINER_ID" >/dev/null 2>&1 || true
          fi
          if [[ -n "${HOTEL_WEBSITE_C1B2_VOLUME_NAME:-}" ]]; then
            docker volume rm "$HOTEL_WEBSITE_C1B2_VOLUME_NAME" >/dev/null 2>&1 || true
          fi
          echo "Task-owned C1B2 container and volume cleanup attempted; no shared Docker resources were targeted."

      - name: Create a uniquely labeled disposable C1B1 CMS acceptance database
        id: c1b1-db
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(openssl rand -hex 8)"
          volume="hotel-content-c1b1-${run_id}"
          container_name="hotel-content-c1b1-${run_id}"
          database="bazarbaaz_hotel_c1b1_${run_id}"
          password="f5_c1b1_${run_id}_ephemeral_only"

          docker volume create "$volume" >/dev/null
          echo "HOTEL_CONTENT_C1B1_VOLUME_NAME=$volume" >> "$GITHUB_ENV"
          echo "HOTEL_CONTENT_C1B1_RUN_ID=$run_id" >> "$GITHUB_ENV"

          container_id="$(docker run --detach \
            --name "$container_name" \
            --label codex.task=hotel-content-c1b1-db-acceptance \
            --label "codex.run_id=${run_id}" \
            --mount "type=volume,source=${volume},target=/var/lib/postgresql/data" \
            --publish 127.0.0.1:5433:5432 \
            --env "POSTGRES_DB=${database}" \
            --env POSTGRES_USER=c1b1_test \
            --env "POSTGRES_PASSWORD=${password}" \
            postgres:17-alpine)"
          echo "HOTEL_CONTENT_C1B1_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$container_id" pg_isready -U c1b1_test -d "$database" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          url="postgresql://c1b1_test:${password}@127.0.0.1:5433/${database}?schema=public"
          {
            echo "DATABASE_URL=${url}"
            echo "DIRECT_URL=${url}"
            echo "AI_MEDIA_LOCAL_DOCKER_E2E=1"
            echo "HOTEL_CONTENT_C1B1_PG_ACCEPTANCE=1"
          } >> "$GITHUB_ENV"

          echo "Disposable C1B1 PostgreSQL 17 target started on loopback port 5433 with synthetic-only credentials and task/run labels."

      - name: Migrate the disposable C1B1 CMS acceptance database
        run: pnpm exec prisma migrate deploy

      - name: Run C1B1 CMS authorization and transition acceptance
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-content-c1b1.postgres.local.test.ts

      - name: Remove only the disposable C1B1 acceptance database resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOTEL_CONTENT_C1B1_CONTAINER_ID:-}" ]]; then
            docker rm --force "$HOTEL_CONTENT_C1B1_CONTAINER_ID" >/dev/null 2>&1 || true
          fi
          if [[ -n "${HOTEL_CONTENT_C1B1_VOLUME_NAME:-}" ]]; then
            docker volume rm "$HOTEL_CONTENT_C1B1_VOLUME_NAME" >/dev/null 2>&1 || true
          fi
          echo "Task-owned C1B1 container and volume cleanup attempted; no shared Docker resources were targeted."

  authenticated-staging-browser:
    if: inputs.run_staging_browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hotel-f5-staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated CMS workflow E2E
        env:
          HOTEL_F5_E2E_ENABLED: "1"
          HOTEL_F5_APP_URL: ${{ vars.HOTEL_F5_APP_URL }}
          HOTEL_F5_PUBLIC_PAGE_URL: ${{ vars.HOTEL_F5_PUBLIC_PAGE_URL }}
          HOTEL_F5_PUBLIC_ORIGIN: ${{ vars.HOTEL_F5_PUBLIC_ORIGIN }}
          HOTEL_F5_FOREIGN_PUBLIC_ORIGIN: ${{ vars.HOTEL_F5_FOREIGN_PUBLIC_ORIGIN }}
          HOTEL_F5_UNKNOWN_DOMAIN_API_URL: ${{ vars.HOTEL_F5_UNKNOWN_DOMAIN_API_URL }}
          HOTEL_F5_INACTIVE_DOMAIN_API_URL: ${{ vars.HOTEL_F5_INACTIVE_DOMAIN_API_URL }}
          HOTEL_F5_FOREIGN_DOMAIN_API_URL: ${{ vars.HOTEL_F5_FOREIGN_DOMAIN_API_URL }}
          HOTEL_F5_CAPABILITY_DISABLED_API_URL: ${{ vars.HOTEL_F5_CAPABILITY_DISABLED_API_URL }}
          HOTEL_F5_PUBLIC_GATE_OFF_API_URL: ${{ vars.HOTEL_F5_PUBLIC_GATE_OFF_API_URL }}
          HOTEL_F5_ORGANIZATION_ID: ${{ vars.HOTEL_F5_ORGANIZATION_ID }}
          HOTEL_F5_PROPERTY_ID: ${{ vars.HOTEL_F5_PROPERTY_ID }}
          HOTEL_F5_PROPERTY_SLUG: ${{ vars.HOTEL_F5_PROPERTY_SLUG }}
          HOTEL_F5_FOREIGN_ORGANIZATION_ID: ${{ vars.HOTEL_F5_FOREIGN_ORGANIZATION_ID }}
          HOTEL_F5_FOREIGN_PROPERTY_ID: ${{ vars.HOTEL_F5_FOREIGN_PROPERTY_ID }}
          HOTEL_F5_AUTHOR_USERNAME: ${{ vars.HOTEL_F5_AUTHOR_USERNAME }}
          HOTEL_F5_AUTHOR_PASSWORD: ${{ secrets.HOTEL_F5_AUTHOR_PASSWORD }}
          HOTEL_F5_REVIEWER_USERNAME: ${{ vars.HOTEL_F5_REVIEWER_USERNAME }}
          HOTEL_F5_REVIEWER_PASSWORD: ${{ secrets.HOTEL_F5_REVIEWER_PASSWORD }}
          HOTEL_F5_MANAGER_USERNAME: ${{ vars.HOTEL_F5_MANAGER_USERNAME }}
          HOTEL_F5_MANAGER_PASSWORD: ${{ secrets.HOTEL_F5_MANAGER_PASSWORD }}
          HOTEL_F5_FOREIGN_USERNAME: ${{ vars.HOTEL_F5_FOREIGN_USERNAME }}
          HOTEL_F5_FOREIGN_PASSWORD: ${{ secrets.HOTEL_F5_FOREIGN_PASSWORD }}
          HOTEL_F5_SYNTHETIC_MEDIA_ID: ${{ vars.HOTEL_F5_SYNTHETIC_MEDIA_ID }}
          HOTEL_F5_FOREIGN_MEDIA_IMAGE_ID: ${{ vars.HOTEL_F5_FOREIGN_MEDIA_IMAGE_ID }}
          HOTEL_F5_FOREIGN_MEDIA_ASSOCIATION_ID: ${{ vars.HOTEL_F5_FOREIGN_MEDIA_ASSOCIATION_ID }}
          HOTEL_F5_FIXTURE_TAG: ${{ vars.HOTEL_F5_FIXTURE_TAG }}
          HOTEL_F5_VERCEL_PROTECTION_BYPASS: ${{ secrets.HOTEL_F5_VERCEL_PROTECTION_BYPASS }}
          HOTEL_F5_WEBSITE_GATE_ENABLED_FOR_TEST: ${{ vars.HOTEL_F5_WEBSITE_GATE_ENABLED_FOR_TEST }}
          HOTEL_F5_BOOKING_GATE_DISABLED_FOR_TEST: ${{ vars.HOTEL_F5_BOOKING_GATE_DISABLED_FOR_TEST }}
          HOTEL_F5_PAYMENT_GATE_DISABLED_FOR_TEST: ${{ vars.HOTEL_F5_PAYMENT_GATE_DISABLED_FOR_TEST }}
          HOTEL_F5_NOTIFICATION_GATE_DISABLED_FOR_TEST: ${{ vars.HOTEL_F5_NOTIFICATION_GATE_DISABLED_FOR_TEST }}
        run: pnpm exec playwright test --config=playwright.hotel-f5.config.mjs
