name: Hotel Phase 1 Operational PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/hotel-phase1-operational-pg.yml"
      - "lib/hotel/**"
      - "app/api/organizations/**/hotels/**"
      - "app/**/hotel-reservations/**"
      - "components/hotel-operations/**"
      - "prisma/**"
      - "scripts/db/guard-local-prisma-env.mjs"
      - "scripts/e2e/register-server-only.cjs"
      - "tests/integration/hotel-reservation-atomic.local.test.ts"
      - "tests/integration/hotel-operational-reservations.local.test.ts"
      - "tests/integration/hotel-offline-payments.local.test.ts"
      - "tests/integration/hotel-offline-payment-rollback.local.test.ts"
      - "tests/integration/hotel-offline-receipt-attachment-failure.local.test.ts"
      - "tests/integration/hotel-offline-receipt-reconciliation.local.test.ts"
      - "tests/integration/hotel-operations.local.test.ts"
      - "tests/integration/hotel-operations-http.local.test.ts"
      - "scripts/hotel/reconcile-orphaned-payment-receipts.mts"
      - "tests/unit/hotel-offline-payment-route.test.ts"
      - "tests/unit/hotel-offline-receipt-route.test.ts"
      - "tests/unit/hotel-guest-reservations-route.test.ts"
      - "tests/unit/hotel-offline-policy-settings.test.tsx"
      - "tests/unit/hotel-offline-payment-reversal-ui.test.tsx"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hotel-phase1-operational-pg.yml"
      - "lib/hotel/**"
      - "prisma/**"
      - "scripts/db/guard-local-prisma-env.mjs"
      - "scripts/e2e/register-server-only.cjs"
      - "tests/integration/hotel-reservation-atomic.local.test.ts"
      - "tests/integration/hotel-operational-reservations.local.test.ts"
      - "tests/integration/hotel-offline-payments.local.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-phase1-operational-pg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hotel-phase1-operational-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: retail_hero_test
          POSTGRES_USER: hero_test
          POSTGRES_PASSWORD: local_admin_fixture_only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U hero_test -d retail_hero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://hero_test:local_admin_fixture_only@127.0.0.1:55439/retail_hero_test
      DIRECT_URL: postgresql://hero_test:local_admin_fixture_only@127.0.0.1:55439/retail_hero_test
      DATABASE_RUNTIME_ADAPTER: postgresql
      LOCAL_PRISMA_EXPECTED_PORT: "55439"
      RETAIL_HERO_EXPECTED_DATABASE: retail_hero_test
      LOCAL_BASELINE_BOOTSTRAP_DISPOSABLE: "true"
      AI_MEDIA_APPLICATION_STORAGE_ADAPTER: local-test
      HOTEL_GUEST_PORTAL_ENABLED: "1"
      HOTEL_OPERATIONAL_RESERVATIONS_ENABLED: "0"
      HOTEL_RESERVATION_PG_ACCEPTANCE: "1"
      HOTEL_OPERATIONAL_RESERVATION_ACCEPTANCE: "1"
      HOTEL_OFFLINE_PAYMENT_PG_ACCEPTANCE: "1"
      HOTEL_OFFLINE_RECEIPT_PG_ACCEPTANCE: "1"
      HOTEL_RECEIPT_RECONCILIATION_PG_ACCEPTANCE: "1"
      HOTEL_OPERATIONS_PG_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and generate Prisma client
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Apply repository migrations through the local guard
        id: apply_migrations
        run: pnpm run db:migrate:local
      - name: Run atomic reservation repository acceptance
        id: atomic_reservation
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-reservation-atomic.local.test.ts
      - name: Run operational reservation acceptance
        id: operational_reservation
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-operational-reservations.local.test.ts
      - name: Run offline payment acceptance
        id: offline_payment
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-offline-payments.local.test.ts
      - name: Run offline payment transactional rollback acceptance
        id: payment_rollback
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-offline-payment-rollback.local.test.ts
      - name: Run private receipt attachment failure acceptance
        id: receipt_failure
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --experimental-test-module-mocks --test tests/integration/hotel-offline-receipt-attachment-failure.local.test.ts
      - name: Run private receipt reconciliation acceptance
        id: receipt_reconciliation
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-offline-receipt-reconciliation.local.test.ts
      - name: Run Hotel operations service and tenant-isolation acceptance
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-operations.local.test.ts
      - name: Install Chromium for Hotel operations browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Hotel operations HTTP and browser acceptance
        id: hotel_operations_http
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/hotel-operations-http.local.test.ts
      - name: Run offline payment authorization tests
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --experimental-test-module-mocks --test tests/unit/hotel-offline-payment-route.test.ts
      - name: Run private receipt storage tests
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/unit/hotel-offline-receipt-storage.test.ts
      - name: Run private receipt authorization tests
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --experimental-test-module-mocks --test tests/unit/hotel-offline-receipt-route.test.ts
      - name: Run guest reservation and policy tests
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --experimental-test-module-mocks --test tests/unit/hotel-guest-reservations-route.test.ts tests/unit/hotel-offline-policy-settings.test.tsx tests/unit/hotel-offline-payment-reversal-ui.test.tsx
      - name: Check TypeScript
        id: hotel_typescript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Identify failed PostgreSQL acceptance step
        if: failure()
        shell: bash
        run: |
          {
            echo '## Hotel PostgreSQL acceptance failure'
            echo '- PostgreSQL 17 is a job-owned ephemeral service and is destroyed with the GitHub-hosted runner.'
            if [[ '${{ steps.apply_migrations.outcome }}' == 'failure' ]]; then echo '- Failed step: Apply repository migrations through the local guard'; fi
            if [[ '${{ steps.atomic_reservation.outcome }}' == 'failure' ]]; then echo '- Failed step: Run atomic reservation repository acceptance'; fi
            if [[ '${{ steps.operational_reservation.outcome }}' == 'failure' ]]; then echo '- Failed step: Run operational reservation acceptance'; fi
            if [[ '${{ steps.offline_payment.outcome }}' == 'failure' ]]; then echo '- Failed step: Run offline payment acceptance'; fi
            if [[ '${{ steps.payment_rollback.outcome }}' == 'failure' ]]; then echo '- Failed step: Run offline payment transactional rollback acceptance'; fi
            if [[ '${{ steps.receipt_failure.outcome }}' == 'failure' ]]; then echo '- Failed step: Run private receipt attachment failure acceptance'; fi
            if [[ '${{ steps.hotel_operations_http.outcome }}' == 'failure' ]]; then echo '- Failed step: Run Hotel operations HTTP and browser acceptance'; fi
            if [[ '${{ steps.hotel_typescript.outcome }}' == 'failure' ]]; then echo '- Failed step: Check TypeScript'; fi
          } >> "$GITHUB_STEP_SUMMARY"
