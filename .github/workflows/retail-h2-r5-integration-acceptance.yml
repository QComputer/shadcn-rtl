name: Retail H2 plus R5 integration acceptance

on:
  push:
    branches:
      - codex/retail-h2-r5-integration-20261014

permissions:
  contents: read

jobs:
  retail-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: retail_r5
          POSTGRES_DB: bazarbaaz_retail_r5
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd "pg_isready -U retail_r5 -d bazarbaaz_retail_r5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --label bazarbaaz.task=retail-h2-r5-integration
          --label bazarbaaz.run=${{ github.run_id }}-${{ github.run_attempt }}
    env:
      DATABASE_URL: postgresql://retail_r5@127.0.0.1:55433/bazarbaaz_retail_r5?schema=public
      DIRECT_URL: postgresql://retail_r5@127.0.0.1:55433/bazarbaaz_retail_r5?schema=public
      LOCAL_PRISMA_EXPECTED_PORT: "55433"
      RETAIL_R4_EXPECTED_DATABASE: bazarbaaz_retail_r5
      RETAIL_R5_EXPECTED_DATABASE: bazarbaaz_retail_r5
      RETAIL_H2_EXPECTED_DATABASE: bazarbaaz_retail_r5
      RETAIL_H2_EXPECTED_ROLE: retail_r5
      RETAIL_H2_EXPECTED_MIGRATIONS: "102"
      RETAIL_H2_EXPECTED_TASK_LABEL: retail-h2-r5-integration
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      AI_MEDIA_LOCAL_DOCKER_E2E: "1"
      INOTI_PAYMENT_CORRELATION_ACTIVE_KEY_VERSION: "997"
      RETAIL_PAYMENT_EXPIRATION_SECRET: synthetic-retail-expiration-secret

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create ephemeral test credentials
        shell: bash
        run: |
          auth_secret="$(openssl rand -hex 32)"
          test_password="$(openssl rand -hex 20)"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$test_password"
          echo "NEXTAUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "RETAIL_R4_TEST_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Prisma generation and schema validation
        run: |
          pnpm exec prisma generate
          pnpm exec prisma validate
      - name: Verify exact loopback disposable PG17 identity and empty schema
        run: node scripts/retail/h2-preflight.mjs
      - name: Verify integration branch deployment suppression before remote validation
        shell: bash
        run: |
          node -e 'const c=require("./vercel.json"); if(c.git?.deploymentEnabled?.["codex/retail-h2-r5-integration-20261014"] !== false) process.exit(1);'
          VERCEL_GIT_COMMIT_REF=codex/retail-h2-r5-integration-20261014 node scripts/retail/ignore-r4-vercel.mjs
          VERCEL_GIT_COMMIT_REF=codex/retail-h2-taxonomy-20261014 node scripts/retail/ignore-r4-vercel.mjs
          VERCEL_GIT_COMMIT_REF=codex/retail-r4-checkout-20261013 node scripts/retail/ignore-r4-vercel.mjs
          if VERCEL_GIT_COMMIT_REF=main node scripts/retail/ignore-r4-vercel.mjs; then
            echo "Main must retain its normal Vercel build behavior"
            exit 1
          fi
      - name: Verify accepted H2 and R5 migration filenames and SHA-256 checksums
        run: node scripts/retail/h2-r5-migration-reconcile.mjs
      - name: Verify exact ordered 102-migration chain and stage the 101-migration R5 base
        run: node scripts/retail/h2-migration-stage.mjs
      - name: Apply all 101 R5 migrations to the identity-verified empty database
        env:
          H2_BASE_SCHEMA: ${{ runner.temp }}/retail-h2-r4-base-prisma/schema.prisma
          H2_BASE_MIGRATIONS: ${{ runner.temp }}/retail-h2-r4-base-prisma/migrations
        run: |
          pnpm exec prisma migrate deploy --config prisma.h2-base.config.ts
          pnpm exec prisma migrate status --config prisma.h2-base.config.ts
      - name: Exercise R5 shared-account routing on the unseeded base database
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/inoti-shared-account-routing.local.test.ts
      - name: Seed three synthetic legacy products before H2 taxonomy migration
        run: pnpm exec tsx scripts/retail/h2-legacy-product-preservation.mjs seed
      - name: Apply H2 as migration 102 and verify all prior products and stock
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
          pnpm exec tsx scripts/retail/h2-legacy-product-preservation.mjs verify
      - name: Seed platform and R4 tenant fixtures
        run: |
          pnpm db:seed
          pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs scripts/retail/r4-fixtures.mjs seed
      - name: Seed Cafe Leo native Shop and dedicated simulated account fixture
        env:
          INOTI_USSD_ACCEPTANCE_SIMULATION: "true"
          INOTI_CAFE_LEO_USERNAME: r5-ci-placeholder
          INOTI_CAFE_LEO_PASSWORD: r5-ci-placeholder
          INOTI_CAFE_LEO_USSD_ENDPOINT: https://127.0.0.1:59999/ExternalUssdPay.asmx
          INOTI_CAFE_LEO_USSD_CODE_NAME: R5CAFE
          INOTI_CAFE_LEO_USSD_DIAL_STRING: '*6655*R5CAFE*2#'
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs scripts/retail/r5-cafe-fixtures.mjs seed
      - name: Verify public taxonomy filters and tenant-scoped constraints
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs scripts/retail/r4-fixtures.mjs verify
      - name: H2 taxonomy, public catalog, and H2/R4 unit regressions
        run: >-
          pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test
          tests/unit/retail-h2-product-taxonomy.test.mjs
          tests/unit/public-catalog-contract.test.ts
          tests/unit/retail-attribute-validation.test.ts
          tests/unit/tenant-capabilities-and-push.test.ts
          tests/unit/shop-menu-filter.test.ts
          tests/unit/hotel-management-api-security.test.ts
          tests/integration/order-price-snapshot.local.test.ts
      - name: R5 checkout, stock, expiration, cancellation, and payment reconciliation acceptance
        env:
          RETAIL_R4_CHECKOUT_PG_ACCEPTANCE: "1"
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/retail-r4-checkout.local.test.ts
      - name: R5 account routing and iNoti security regressions
        env:
          INOTI_USSD_ACCEPTANCE_SIMULATION: "true"
        run: >-
          pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test --test-concurrency=1
          tests/unit/inoti-account-routing.test.ts
          tests/unit/inoti-ussd-foundation.test.ts
          tests/unit/inoti-ussd-callback-activation.test.ts
          tests/integration/inoti-ussd.local.test.ts
          tests/integration/payment-inoti-e2e.local.test.ts
      - name: Payment money and idempotency migration regressions
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/payment-money-migration.local.test.ts
      - name: Full ESLint
        run: pnpm run lint --no-cache
      - name: TypeScript
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Restore synthetic fixtures after integration test cleanup
        env:
          INOTI_USSD_ACCEPTANCE_SIMULATION: "true"
          INOTI_CAFE_LEO_USERNAME: r5-ci-placeholder
          INOTI_CAFE_LEO_PASSWORD: r5-ci-placeholder
          INOTI_CAFE_LEO_USSD_ENDPOINT: https://127.0.0.1:59999/ExternalUssdPay.asmx
          INOTI_CAFE_LEO_USSD_CODE_NAME: R5CAFE
          INOTI_CAFE_LEO_USSD_DIAL_STRING: '*6655*R5CAFE*2#'
        run: |
          pnpm db:seed
          pnpm exec tsx scripts/retail/r4-fixtures.mjs seed
          pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs scripts/retail/r5-cafe-fixtures.mjs seed
      - name: Start isolated production server
        env:
          INOTI_USSD_ACCEPTANCE_SIMULATION: "true"
          INOTI_CAFE_LEO_USERNAME: r5-ci-placeholder
          INOTI_CAFE_LEO_PASSWORD: r5-ci-placeholder
          INOTI_CAFE_LEO_USSD_ENDPOINT: https://127.0.0.1:59999/ExternalUssdPay.asmx
          INOTI_CAFE_LEO_USSD_CODE_NAME: R5CAFE
          INOTI_CAFE_LEO_USSD_DIAL_STRING: '*6655*R5CAFE*2#'
          RETAIL_RECEIPT_TEST_STORAGE: "1"
          RETAIL_RECEIPT_LOCAL_ROOT: ${{ runner.temp }}/retail-r5-private-receipts
        run: |
          mkdir -p artifacts/retail-h2-r5-browser
          pnpm start --port 3000 > artifacts/retail-h2-r5-browser/next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/fa/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/retail-h2-r5-browser/next.log
          exit 1
      - name: Authenticated H2 manager, R4 storefront, and shared checkout browser acceptance
        env:
          RETAIL_R4_BASE_URL: http://127.0.0.1:3000
          RETAIL_R4_PLAYWRIGHT_ENTRY: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          set -o pipefail
          mkdir -p artifacts/retail-r4-browser
          node scripts/retail/r4-browser-e2e.mjs 2>&1 | tee artifacts/retail-h2-r5-browser/h2-r4-browser.log
      - name: Cafe Leo native Shop and dedicated iNoti account browser acceptance
        env:
          RETAIL_R5_BASE_URL: http://127.0.0.1:3000
          RETAIL_R5_PLAYWRIGHT_ENTRY: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          set -o pipefail
          mkdir -p artifacts/retail-r5-browser
          node scripts/retail/r5-cafe-native-shop-browser-e2e.mjs 2>&1 | tee artifacts/retail-h2-r5-browser/r5-cafe-browser.log
      - name: Upload combined browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-h2-r5-integration-browser-evidence
          path: |
            artifacts/retail-h2-r5-browser/
            artifacts/retail-r4-browser/
            artifacts/retail-r5-browser/
          if-no-files-found: warn
