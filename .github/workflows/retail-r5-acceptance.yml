name: Retail R5 shared iNoti routing acceptance

on:
  push:
    branches:
      - codex/retail-r5-platform-ussd-routing-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retail-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: retail_r5
          POSTGRES_DB: bazarbaaz_retail_r5
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U retail_r5 -d bazarbaaz_retail_r5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://retail_r5@127.0.0.1:55433/bazarbaaz_retail_r5?schema=public
      DIRECT_URL: postgresql://retail_r5@127.0.0.1:55433/bazarbaaz_retail_r5?schema=public
      LOCAL_PRISMA_EXPECTED_PORT: "55433"
      RETAIL_R4_EXPECTED_DATABASE: bazarbaaz_retail_r5
      RETAIL_R5_EXPECTED_DATABASE: bazarbaaz_retail_r5
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      AI_MEDIA_LOCAL_DOCKER_E2E: "1"
      INOTI_PAYMENT_CORRELATION_ACTIVE_KEY_VERSION: "997"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create ephemeral test credentials
        run: |
          auth_secret="$(openssl rand -hex 32)"
          test_password="$(openssl rand -hex 20)"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$test_password"
          echo "NEXTAUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "RETAIL_R4_TEST_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Validate Prisma schema
        run: pnpm exec prisma validate
      - name: Apply all migrations to disposable PostgreSQL 17
        run: pnpm exec prisma migrate deploy
      - name: Test R5 account routing on an unseeded database
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/inoti-shared-account-routing.local.test.ts
      - name: Seed local synthetic regression fixtures
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs prisma/seed.ts
      - name: Seed fashion, electronics, and restaurant compatibility fixtures
        run: pnpm exec tsx scripts/retail/r4-fixtures.mjs seed
      - name: Seed Cafe Leo native Shop fixture in the disposable database
        run: pnpm exec tsx scripts/retail/r5-cafe-fixtures.mjs seed
      - name: Retail checkout and payment integration acceptance
        env:
          RETAIL_R4_CHECKOUT_PG_ACCEPTANCE: "1"
          AI_MEDIA_LOCAL_DOCKER_E2E: "1"
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/retail-r4-checkout.local.test.ts
      - name: Verify R5 and restaurant iNoti regressions
        run: >-
          pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test
          tests/unit/inoti-account-routing.test.ts
          tests/unit/inoti-ussd-foundation.test.ts
          tests/unit/inoti-ussd-callback-activation.test.ts
          tests/integration/inoti-ussd.local.test.ts
          tests/integration/payment-inoti-e2e.local.test.ts
      - name: Payment money migration compatibility acceptance
        run: pnpm exec tsx --require=./scripts/e2e/register-server-only.cjs --test tests/integration/payment-money-migration.local.test.ts
      - name: ESLint
        run: pnpm run lint --no-cache
      - name: TypeScript
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
      - name: Install Chromium for isolated browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated acceptance server
        env:
          INOTI_ALLOW_LIVE_PAYMENTS: "true"
          INOTI_RUNTIME_MUTATIONS_APPROVED: "true"
          INOTI_USSD_LIVE_VERIFICATION_ENABLED: "true"
          INOTI_CAFE_LEO_USERNAME: r5-ci-placeholder
          INOTI_CAFE_LEO_PASSWORD: r5-ci-placeholder
          INOTI_CAFE_LEO_USSD_ENDPOINT: https://127.0.0.1:59999/ExternalUssdPay.asmx
          INOTI_CAFE_LEO_USSD_CODE_NAME: R5CAFE
          INOTI_CAFE_LEO_USSD_DIAL_STRING: '*6655*R5CAFE*2#'
        run: |
          mkdir -p artifacts/retail-r4-browser artifacts/retail-r5-browser
          pnpm start --port 3000 > artifacts/retail-r5-browser/next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/fa/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/retail-r5-browser/next.log
          exit 1
      - name: Authenticated R4 retail and restaurant regression browser acceptance
        env:
          RETAIL_R4_BASE_URL: http://127.0.0.1:3000
          RETAIL_R4_PLAYWRIGHT_ENTRY: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          set -o pipefail
          node scripts/retail/r4-browser-e2e.mjs 2>&1 | tee artifacts/retail-r4-browser/browser.log
      - name: Native Cafe Leo Shop USSD-pending browser acceptance
        env:
          RETAIL_R5_BASE_URL: http://127.0.0.1:3000
          RETAIL_R5_PLAYWRIGHT_ENTRY: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          set -o pipefail
          node scripts/retail/r5-cafe-native-shop-browser-e2e.mjs 2>&1 | tee artifacts/retail-r5-browser/browser.log
      - name: Upload isolated browser evidence and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-r5-browser-evidence
          path: |
            artifacts/retail-r4-browser/
            artifacts/retail-r5-browser/
          if-no-files-found: warn
