name: RunFlare deterministic Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/runflare-docker-build.yml
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - prisma/**
      - scripts/build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      DIRECT_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build deterministic RunFlare image without publishing
        run: >-
          docker buildx build --load --tag bazarbaaz-runflare-ci:${GITHUB_SHA}
          --build-arg DATABASE_URL --build-arg DIRECT_URL
          --build-arg NEXT_TELEMETRY_DISABLED
          --file Dockerfile .
