        width: 56px;
        height: 56px;
        display: grid;

        border-radius: 8px;
        background: var(--accent);
        color: #082f49;
        font-size: 28px;
        font-weight: 800;
        direction: ltr;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 800;
      }

      p {
        margin: 0;
        color: var(--muted);
